services:

  db:
    image: postgres:15
    container_name: db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: always

  api:
    build: ./api
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    restart: always

  etl:
    build: ./etl
    container_name: etl
    depends_on:
      - api
      - db
    env_file:
      - .env
    restart: always